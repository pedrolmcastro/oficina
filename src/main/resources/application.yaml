app:
  seguranca:
    admin:
      nome-usuario: ${ADMIN_NOME_USUARIO}
      hash-senha: ${ADMIN_HASH_SENHA}
    jwt:
      segredo: ${JWT_SEGREDO}
      validade: 30m
spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/oficina?currentSchema=oficina
    username: oficina
    password: ${POSTGRES_PASSWORD}
  flyway:
    default-schema: public
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: oficina
  threads:
    virtual:
      enabled: true
management:
  server:
    port: 8081
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: prometheus
