import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.10.4'
	id 'com.github.spotbugs' version '6.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'java'
	id 'net.ltgt.errorprone' version '5.2.0'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'org.springframework.boot' version '4.1.2'
}

group = 'com.oficina'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

jacoco {
	toolVersion = '0.8.16'
}

checkstyle {
	toolVersion = '14.3.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	ignoreFailures = false
}

spotless {
	java {
		eclipse().configFile('config/formatter/java-formatter.xml')
	}
}

spotbugs {
	toolVersion = '4.10.5'
	ignoreFailures = false
	effort = Effort.valueOf('MAX')
	reportLevel = Confidence.valueOf('LOW')
}

sonar {
	properties {
		property 'sonar.projectKey', 'pedrolmcastro_oficina'
		property 'sonar.organization', 'pedrolmcastro'
		property 'sonar.tests', (sourceSets.test.allSource.srcDirs + sourceSets.integrationTest.allSource.srcDirs).findAll { it.isDirectory() }
		property 'sonar.java.test.binaries', (sourceSets.test.output.classesDirs + sourceSets.integrationTest.output.classesDirs).files.findAll { it.isDirectory() }
		property 'sonar.java.test.libraries', (sourceSets.test.runtimeClasspath + sourceSets.integrationTest.runtimeClasspath).files
		properties['sonar.junit.reportPaths'] += tasks.named('integrationTest', Test).get().reports.junitXml.outputLocation.get().asFile
	}
}

dependencies {
	errorprone 'com.google.errorprone:error_prone_core:2.51.0'
	errorprone 'com.uber.nullaway:nullaway:0.14.3'
	implementation 'org.jspecify:jspecify:1.0.0'
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add('-Werror')

	options.errorprone {
		allSuggestionsAsWarnings = true
		error('NullAway')
		option('NullAway:AnnotatedPackages', 'com.oficina')
		option('NullAway:JSpecifyMode', 'true')
		option('NullAway:ExhaustiveOverride', 'true')
	}
}

tasks.withType(SpotBugsTask).configureEach {
	reports {
		html.required = true
		xml.required = true
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest')
	dependsOn tasks.named('jacocoTestReport')
}

tasks.named('sonar') {
	dependsOn tasks.named('check')
}

tasks.named('jacocoTestReport', JacocoReport) {
	description = 'Generates combined coverage reports for unit and integration tests.'
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	executionData tasks.named('test').get(), tasks.named('integrationTest').get()

	reports {
		html.required = true
		xml.required = true
	}
}
