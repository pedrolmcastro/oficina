import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'checkstyle'
    id 'eclipse'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'com.github.spotbugs' version '6.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'java'
    id 'net.ltgt.errorprone' version '5.2.0'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.oficina'
version = '0.0.1-SNAPSHOT'

// CVE-2026-104721: keep logback-classic and logback-core on the patched release
ext['logback.version'] = '1.6.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    bdd {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

eclipse {
    classpath {
        testSourceSets = testSourceSets.get() + [sourceSets.integrationTest, sourceSets.bdd]
    }
}

configurations {
    bddImplementation.extendsFrom testImplementation
    bddRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

configurations.matching {
    it.name == 'checkstyle' || it.name == 'annotationProcessor' || it.name.endsWith('AnnotationProcessor')
}.configureEach { configuration ->
    project.dependencies.constraints.add(configuration.name, 'com.google.guava:guava:33.7.2-jre') {
        because 'CVE-2026-102554 is fixed in Guava 33.7.2'
    }
}

jacoco {
    toolVersion = '0.8.16'
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

spotless {
    java {
        eclipse().configFile('config/formatter/java-formatter.xml')
    }
}

spotbugs {
    toolVersion = '4.10.5'
    ignoreFailures = false
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('LOW')
}

sonar {
    properties {
        property 'sonar.projectKey', 'pedrolmcastro_oficina'
        property 'sonar.organization', 'pedrolmcastro'
        property "sonar.projectName", "oficina"
        property 'sonar.tests', (sourceSets.test.allSource.srcDirs + sourceSets.integrationTest.allSource.srcDirs + sourceSets.bdd.allSource.srcDirs).findAll { it.isDirectory() }
        property 'sonar.java.test.binaries', (sourceSets.test.output.classesDirs + sourceSets.integrationTest.output.classesDirs + sourceSets.bdd.output.classesDirs).files.findAll { it.isDirectory() }
        property 'sonar.java.test.libraries', (sourceSets.test.runtimeClasspath + sourceSets.integrationTest.runtimeClasspath + sourceSets.bdd.runtimeClasspath).files
        properties['sonar.junit.reportPaths'] += tasks.named('integrationTest', Test).get().reports.junitXml.outputLocation.get().asFile
        properties['sonar.junit.reportPaths'] += tasks.named('bdd', Test).get().reports.junitXml.outputLocation.get().asFile
    }
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.51.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.3'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // Unused JSONPath/json-smart test support. No release fixes CVE-2026-113602 yet
        exclude group: 'com.jayway.jsonpath', module: 'json-path'
        exclude group: 'net.minidev', module: 'json-smart'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    bddImplementation platform('io.cucumber:cucumber-bom:8.0.4')
    bddImplementation 'io.cucumber:cucumber-spring'
    bddImplementation 'org.junit.platform:junit-platform-suite'
    bddImplementation 'io.cucumber:cucumber-java'
    bddImplementation 'io.cucumber:cucumber-junit-platform-engine'
    bddImplementation 'io.rest-assured:rest-assured:6.3.0'
    integrationTestImplementation 'io.rest-assured:rest-assured:6.3.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Werror')

    options.errorprone {
        allSuggestionsAsWarnings = true
        disable('RequireExplicitNullMarking')
        error('NullAway')
        option('NullAway:AnnotatedPackages', 'com.oficina')
        option('NullAway:JSpecifyMode', 'true')
        option('NullAway:ExhaustiveOverride', 'true')
    }
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.register('bdd', Test) {
    description = 'Runs Cucumber acceptance tests.'
    group = 'verification'
    testClassesDirs = sourceSets.bdd.output.classesDirs
    classpath = sourceSets.bdd.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }
    testDefinitionDirs.from('src/bdd/resources/features')
    shouldRunAfter tasks.named('integrationTest')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('bdd')
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('sonar') {
    dependsOn tasks.named('check')
}

tasks.named('jacocoTestReport', JacocoReport) {
    description = 'Generates combined coverage reports for unit, integration and BDD tests.'
    dependsOn tasks.named('test'), tasks.named('integrationTest'), tasks.named('bdd')
    executionData tasks.named('test').get(), tasks.named('integrationTest').get(), tasks.named('bdd').get()

    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    executionData tasks.named('test').get(), tasks.named('integrationTest').get(), tasks.named('bdd').get()
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}
